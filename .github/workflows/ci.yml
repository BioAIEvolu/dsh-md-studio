name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Install Chromium for tests
        run: npx -y playwright@1.64.0 install chromium --with-deps

      - name: Build (self-contained bundle)
        run: node scripts/build.mjs

      - name: Browser tests (offline, real Chromium)
        run: node test/browser.mjs
